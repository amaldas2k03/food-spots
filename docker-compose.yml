services:
  db:
    image: postgres:16-alpine
    container_name: foodspots-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodspots
      POSTGRES_PASSWORD: foodspots
      POSTGRES_DB: foodspots
    ports:
      - "5432:5432"
    volumes:
      - foodspots-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodspots -d foodspots"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodspots-pgdata:
